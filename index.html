    Utan module :

    utan typp='module' så får man

    Fel filnamn / ej existerande fil :
    När webbläsaren parsar script-filen så kommer den att föröka öppna
    obefinglig fil och då smäller det

     och om man har fel filnamn i importen :
     [plugin:vite:import-analysis] Failed to resolve import "./datat" from "src/main.ts". Does the file exist

     Loading module from “http://localhost:5173/src/main.ts?t=1795031584104” was
      blocked because of a disallowed MIME type (“”)

    Dubbel-klick:
    Felen är XSR begränsade man får inte öppna java/typescript hur somhelst i dagens
    webbrowsers.

    Dubbel-klick på filen index.html (öppna den från filhanterare) ger:
    Cross-Origin Request Blocked: The Same Origin Policy disallows reading the
    remote resource at file:///src/main.ts. (Reason: CORS request not http).

    eller om man ändrad fil sökvägen till ./src/main.ts :
    Cross-Origin Request Blocked: The Same Origin Policy disallows reading the
